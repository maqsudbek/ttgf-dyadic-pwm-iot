name: docs

on:
  push:
    # docs/info.md and info.yaml still trigger; skip non-datasheet noise.
    paths-ignore:
      - '.claude/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.vscode/**'
      - '.devcontainer/**'
      - '.mcp.json'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttgf26a
